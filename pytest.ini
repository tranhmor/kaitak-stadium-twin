[pytest]
# `pytest -q` runs tests/ without the slow tests. Slow ones: `pytest -q -m slow`.
# The TN 1822 suite runs on its own: `.venv312/bin/python -m pytest verification`.
testpaths = tests
addopts = -m "not slow"
markers =
    slow: takes more than about 30 s (full regression, full-crowd runs, long verification rigs)
